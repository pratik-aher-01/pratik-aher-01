<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#334155" stroke-opacity=".28"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glowf"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect width="1200" height="420" rx="24" fill="url(#grid)"/>
<circle cx="210" cy="150" r="210" fill="url(#glow)" filter="url(#blur)">
 <animate attributeName="cx" values="210;300;210" dur="9s" repeatCount="indefinite"/>
 <animate attributeName="cy" values="150;240;150" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="990" cy="300" r="240" fill="url(#glow)" filter="url(#blur)">
 <animate attributeName="cx" values="990;880;990" dur="11s" repeatCount="indefinite"/>
</circle>
<g opacity=".65" fill="#38bdf8">
 <circle cx="80" cy="90" r="2"><animate attributeName="cy" values="90;55;90" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="1120" cy="90" r="2"><animate attributeName="cy" values="90;125;90" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="1040" cy="180" r="1.5"><animate attributeName="cx" values="1040;1080;1040" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="140" cy="310" r="1.5"><animate attributeName="cx" values="140;105;140" dur="4.5s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(600 112)" text-anchor="middle">
 <text y="0" fill="#64748b" font-family="monospace" font-size="14" letter-spacing="5">AI SYSTEMS / ENGINEERING / PRODUCT</text>
 <text y="82" fill="#f8fafc" font-family="Arial,sans-serif" font-weight="700" font-size="64">PRATIK AHЕR</text>
 <rect x="-185" y="105" width="370" height="2" rx="1" fill="#38bdf8" filter="url(#glowf)">
   <animate attributeName="width" values="80;370;80" dur="4s" repeatCount="indefinite"/>
   <animate attributeName="x" values="-40;-185;-40" dur="4s" repeatCount="indefinite"/>
 </rect>
 <text y="155" fill="#94a3b8" font-family="monospace" font-size="16">BUILD · BREAK · UNDERSTAND · SHIP</text>
</g>
<g transform="translate(600 300)" stroke="#475569" fill="none">
 <path d="M-330 0H-80 M80 0H330" stroke-dasharray="8 12">
  <animate attributeName="stroke-dashoffset" values="0;40" dur="1.5s" repeatCount="indefinite"/>
 </path>
 <circle cx="-55" cy="0" r="9" stroke="#38bdf8"><animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="55" cy="0" r="9" stroke="#38bdf8"><animate attributeName="r" values="12;6;12" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="0" cy="0" r="17" stroke="#f8fafc"><animate attributeName="r" values="14;20;14" dur="2.5s" repeatCount="indefinite"/></circle>
</g>
</svg>