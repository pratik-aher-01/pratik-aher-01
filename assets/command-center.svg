<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B12"/><stop offset="0.55" stop-color="#0B111B"/><stop offset="1" stop-color="#071019"/>
  </linearGradient>
  <linearGradient id="line" x1="20" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .muted{fill:#64748B}.white{fill:#E2E8F0}.cyan{fill:#38BDF8}.green{fill:#4ADE80}
  </style>
</defs>

